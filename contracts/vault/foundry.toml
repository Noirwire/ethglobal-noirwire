[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
test = "test"
script = "script"
solc = "0.8.34"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "src/=src/",
  "test/=test/",
  "script/=script/",
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.1.0/",
  "forge-std/=dependencies/forge-std-1.9.7/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32

[soldeer]
remappings_generate = false
remappings_regenerate = false

[dependencies]
forge-std = "1.9.7"
"@openzeppelin-contracts" = "5.1.0"
