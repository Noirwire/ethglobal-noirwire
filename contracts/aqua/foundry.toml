[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc = "0.8.34"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=dependencies/forge-std-1.9.7/src/",
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.4.0/",
]

[fuzz]
runs = 256

[invariant]
runs = 16
depth = 24
fail_on_revert = false

[soldeer]
remappings_generate = false
remappings_regenerate = false

[dependencies]
forge-std = "1.9.7"
"@openzeppelin-contracts" = "5.4.0"
